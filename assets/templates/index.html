{% extends "page.html" %}

{% block content %}

<link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap"
    rel="stylesheet">

<div id="content-unit" class="index-page">
    <div id="current-time-wrapper">
        <div id="current-time">
            <span id="current-time-hour"></span>
            <span class="current-time-colon">:</span>
            <span id="current-time-minute"></span>
            <span class="current-time-colon">:</span>
            <span id="current-time-second"></span>
        </div>
        <span class="current-time-info"><b>Eastern Time</b></span>
        <span class="current-time-info">Catch daylight saving time ending tonight</span>
    </div>
</div>

<script>
    const nowHour = document.getElementById("current-time-hour");
    const nowMinute = document.getElementById("current-time-minute");
    const nowSecond = document.getElementById("current-time-second");
    function updateCurrentTime() {
        const now = new Date();
        nowHour.textContent = now.getHours().toString().padStart(2, "0");
        nowMinute.textContent = now.getMinutes().toString().padStart(2, "0");
        nowSecond.textContent = now.getSeconds().toString().padStart(2, "0");
    }
    setInterval(updateCurrentTime, 1000);
</script>

{% endblock %}
