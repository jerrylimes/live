{% extends "page.html" %}

{% block content %}

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Momo+Trust+Display&display=swap" rel="stylesheet">

<div id="content-unit" class="index-page">

    <div id="current-time-wrapper">
        <span class="current-time-info">丙午马年还有</span>
        <div id="current-time">
            <span id="current-time-day"></span>
            <div class="current-time-colon">
                <span class="current-time-info">天</span>
                <!-- <span class="material-symbols-outlined">go_to_line</span> -->
            </div>
            <span id="current-time-hour"></span>
            <div class="current-time-colon">
                <span class="current-time-info">小时</span>
                <!-- <span class="material-symbols-outlined">go_to_line</span> -->
            </div>
            <span id="current-time-minute"></span>
            <div class="current-time-colon">
                <span class="current-time-info">分钟</span>
                <!-- <span class="material-symbols-outlined">go_to_line</span> -->
            </div>
            <span id="current-time-second"></span>
            <div class="current-time-colon">
                <span class="current-time-info">秒</span>
                <!-- <span class="material-symbols-outlined">go_to_line</span> -->
            </div>
        </div>
    </div>
</div>

<div id="cny-backdrop">

</div>

<script>
    const day = document.getElementById("current-time-day");
    const hour = document.getElementById("current-time-hour");
    const minute = document.getElementById("current-time-minute");
    const second = document.getElementById("current-time-second");
    const target = new Date("2026-02-17");
    function countdown() {
        const now = new Date();
        const daysLeft = Math.floor((target - now) / (1000 * 60 * 60 * 24));
        const hoursLeft = Math.floor((target - now) % (1000 * 60 * 60 * 24) / (1000 * 60 * 60));
        const minutesLeft = Math.floor((target - now) % (1000 * 60 * 60) / (1000 * 60));
        const secondsLeft = Math.floor((target - now) % (1000 * 60) / 1000);
        day.textContent = daysLeft.toString();
        hour.textContent = hoursLeft.toString();
        minute.textContent = minutesLeft.toString();
        second.textContent = secondsLeft.toString();
    }
    setInterval(() => {
        countdown();
    }, 1000);
    if (window.innerWidth > 768) {
        $("#directory").toggleClass("active");
        $("#sitemap").toggleClass("expanded");
        $("#directory-expand").toggleClass("rotated");
    }
</script>

{% endblock %}
