<script>
    const path1 = document.getElementById("path1");
    const path2 = document.getElementById("path2");
    const path3 = document.getElementById("path3");
    const path4 = document.getElementById("path4");
    const length = path1.getTotalLength();
    for (const path of [path1, path2, path3, path4]) {
        path.style.fill = "none";
        path.style.stroke = "lightgreen";
        path.style.strokeWidth = 3;
        path.style.strokeDasharray = length;
    }
    path2.style.strokeDashoffset = -length / 2;
    path2.style.stroke = "lightseagreen";
    path3.style.stroke = "cadetblue";
    path4.style.strokeDasharray = length / 8;
    path3.style.strokeDasharray = length / 8;
    path4.style.stroke = "limegreen";
    anim1 = path1.animate(
        [
            { strokeDashoffset: length / 0.5 },
            { strokeDashoffset: length }
        ],
        {
            duration: 8000,
            easing: "ease-in-out",
            iterations: Infinity,
            direction: "alternate"
        }
    );
    anim2 = path2.animate(
        [
            { strokeDashoffset: -length * 1.5 },
            { strokeDashoffset: -length }
        ],
        {
            duration: 4000,
            easing: "ease-in-out",
            iterations: Infinity,
            direction: "alternate"
        }
    );
    anim3 = path3.animate(
        [
            { strokeDashoffset: -length / 2 },
            { strokeDashoffset: -length * 2 }
        ],
        {
            duration: 16000,
            easing: "ease-in-out",
            iterations: Infinity,
            direction: "alternate"
        }
    );
    anim4 = path4.animate(
        [
            { strokeDashoffset: -length / 2 },
            { strokeDashoffset: -length }
        ],
        {
            duration: 16000,
            easing: "ease-in-out",
            iterations: Infinity,
            direction: "alternate"
        }
    )
</script>

<script>
    const hour = document.getElementById("current-time-hour");
    const minute = document.getElementById("current-time-minute");
    const second = document.getElementById("current-time-second");
    const target = new Date("2026-06-08T13:00:00");
    function countdown() {
        const now = new Date();
        const daysLeft = Math.floor((target - now) / (1000 * 60 * 60 * 24));
        hour.textContent = daysLeft.toString();
        now.getTime();
        const hoursLeft = Math.floor(
            ((target - now) % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60),
        );
        const minutesLeft = Math.floor(
            ((target - now) % (1000 * 60 * 60)) / (1000 * 60),
        );
        minute.textContent = hoursLeft.toString();
        second.textContent = minutesLeft.toString();
    }
    function currentTime() {
        const now = new Date();
        const hours = now.getHours().toString().padStart(2, "0");
        const minutes = now.getMinutes().toString().padStart(2, "0");
        const seconds = now.getSeconds().toString().padStart(2, "0");
        hour.textContent = hours;
        minute.textContent = minutes;
        second.textContent = seconds;
    }
    setInterval(() => {
        currentTime();
    }, 1000);
</script>
