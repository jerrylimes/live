{% extends "page.html" %}

{% block content %}

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Momo+Trust+Display&display=swap" rel="stylesheet">

<style>
    #handle-backdrop {
        display: none;
    }

    #handle-content {
        color: #fff0c9;
    }

    #handle-logo {
        background-image: url(https://media.jerryly.cn/home-button-fff0c9.svg);
    }

    #handle-separator {
        background-color: #fff0c9;
    }

    #handle.exited {
        background-color: rgba(255, 255, 255, 0.4);
        border-bottom-color: rgba(255, 255, 255, 0.4);
    }

    #handle-direct a:hover,
    #handle-logo-wrapper:hover,
    #basement-content-layer ul li:hover {
        background-color: rgb(135, 25, 18);
    }

    .basement-circle {
        background-image: radial-gradient(circle at top, #ffffff00 20%, rgb(193, 59, 30), rgb(135, 25, 18));
    }
</style>

<div id="content-unit" class="index-page">

    <div id="current-time-wrapper">
        <span class="current-time-info">还有</span>
        <div id="current-time">
            <span id="current-time-hour"></span>
            <div class="current-time-colon">
                <span class="current-time-info">天</span>
                <!-- <span class="material-symbols-outlined">go_to_line</span> -->
            </div>
            <span id="current-time-minute"></span>
            <div class="current-time-colon">
                <span class="current-time-info">小时</span>
                <!-- <span class="material-symbols-outlined">go_to_line</span> -->
            </div>
            <span id="current-time-second"></span>
            <div class="current-time-colon">
                <span class="current-time-info">分钟</span>
                <!-- <span class="material-symbols-outlined">go_to_line</span> -->
            </div>
        </div>
    </div>
</div>

<div id="cny-backdrop">

</div>

<script>
    const hour = document.getElementById("current-time-hour");
    const minute = document.getElementById("current-time-minute");
    const second = document.getElementById("current-time-second");
    const target = new Date("2026-02-17");
    function countdown() {
        const now = new Date();
        const daysLeft = Math.floor((target - now) / (1000 * 60 * 60 * 24));
        hour.textContent = daysLeft.toString();
        now.getTime();
        const hoursLeft = Math.floor((target - now) % (1000 * 60 * 60 * 24) / (1000 * 60 * 60));
        const minutesLeft = Math.floor((target - now) % (1000 * 60 * 60) / (1000 * 60));
        minute.textContent = hoursLeft.toString();
        second.textContent = minutesLeft.toString();
    }
    setInterval(() => {
        countdown();
    }, 1000);
</script>

{% endblock %}
